rootProject.version = '0.4.14'

buildscript {
    ext {
        protobufVersion = '3.25.3'
        grpcVersion = '1.82.1'
        log4jVersion = '2.17.1'
        gradlePluginVersion = '8.11.2'
    }


    repositories {
        google()
        mavenCentral()
        maven { url 'https://plugins.gradle.org/m2/' }
    }
    dependencies {
        classpath "com.android.tools.build:gradle:${gradlePluginVersion}"
        classpath 'com.google.protobuf:protobuf-gradle-plugin:0.10.0'
        classpath 'com.github.triplet.gradle:play-publisher:3.13.0'
    }
}

allprojects {
    repositories {
        google()
        mavenLocal()
        mavenCentral()
       maven {
            url "https://raw.githubusercontent.com/krussan/maven-repo/master/"
        }
    }
}

tasks.register('outputVersion') {
    new File(projectDir, "version.txt").text = "$rootProject.version"
}
